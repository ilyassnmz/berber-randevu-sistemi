<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <title>Özdede Hair Studio Panel</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // React yüklenmeden önce doğru temayı basar — aksi halde her açılışta
      // bir an yanlış tema görünüp doğrusuna geçer (flash of wrong theme).
      // src/lib/theme.ts'teki mantıkla aynı, ama modül yüklenmeden önce
      // çalışması gerektiği için burada ayrıca (küçük) tekrar ediliyor.
      (function () {
        var theme = localStorage.getItem('ozdede-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f0f17' : '#f7f6f2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
