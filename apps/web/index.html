<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />

    <title>Özdede Hair Studio — Online Randevu</title>
    <meta
      name="description"
      content="Özdede Hair Studio'dan online randevu alın. Ustanızı, gününüzü ve saatinizi seçin; randevunuz anında oluşsun."
    />

    <!-- WhatsApp ve sosyal medyada paylaşıldığında düzgün görünsün.
         Sitenin müşteriye ulaşma yolu WhatsApp'tan gönderilen link olduğu
         için bu etiketler burada gerçekten işe yarıyor. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Özdede Hair Studio — Online Randevu" />
    <meta
      property="og:description"
      content="Ustanızı, gününüzü ve saatinizi seçin; randevunuz anında oluşsun."
    />
    <meta property="og:locale" content="tr_TR" />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <script>
      // React yüklenmeden ÖNCE doğru temayı basar — aksi halde her açılışta
      // bir an yanlış tema görünüp doğrusuna geçer (flash of wrong theme).
      // src/lib/theme.ts'teki mantıkla aynı; modül yüklenmeden çalışması
      // gerektiği için burada (küçük bir) tekrar kaçınılmaz.
      (function () {
        var stored = localStorage.getItem('ozdede-web-theme');
        // Kayıt yoksa AÇIK tema — cihaz tercihine bakılmıyor.
        // Gerekçe için bkz. src/lib/theme.ts → getStoredTheme
        var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f0f17' : '#f7f6f2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
